[project]
name = "emliq"
dynamic = ["version"]
description = "emliq (email IQ): a free, private, local app to bulk-clean your Gmail, with optional AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "yeshaib" }]
keywords = ["gmail", "email", "inbox", "unsubscribe", "cleanup", "ollama", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "flask>=3.0",
    "anthropic>=1.9",
]

[project.urls]
Homepage = "https://github.com/yeshaib/emliq"
Issues = "https://github.com/yeshaib/emliq/issues"
Changelog = "https://github.com/yeshaib/emliq/blob/main/emliq/CHANGELOG.md"

[project.scripts]
emliq = "emliq.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["emliq"]

[tool.setuptools.dynamic]
version = {attr = "emliq.__version__"}

[tool.setuptools.package-data]
emliq = ["static/*", "CHANGELOG.md", "GUIDE.md"]
